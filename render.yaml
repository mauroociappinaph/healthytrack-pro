services:
  - type: web
    name: healthytrack-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci && npx nest build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
